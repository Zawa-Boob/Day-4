<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiTamu - Kiosk & Portal Keamanan</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0A2540', accent: '#D4AF37' } } } }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #000; overflow: hidden; }
        .bg-slide { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background-size: cover; background-position: center; opacity: 0; transition: opacity 1.5s ease; z-index: -2; }
        .bg-slide.active { opacity: 1; }
        .bg-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(to bottom, rgba(10, 37, 64, 0.7), rgba(10, 37, 64, 0.95)); z-index: -1; }
        .glass-panel { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3); }
        .page { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; pointer-events: none; transition: opacity 0.5s ease, transform 0.5s ease; transform: scale(0.95); }
        .page.active { opacity: 1; pointer-events: auto; transform: scale(1); }
        
        /* Animasi Scan Wajah */
        .scan-box { position: relative; width: 220px; height: 220px; border-radius: 50%; border: 4px solid #D4AF37; overflow: hidden; margin: 0 auto; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }
        .scan-laser { position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: #00ff88; box-shadow: 0 0 15px 2px #00ff88; animation: scanning 2s linear infinite; display: none; z-index: 10; }
        @keyframes scanning { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    </style>
</head>
<body class="text-white h-screen w-screen relative select-none">

    <!-- Backgrounds -->
    <div id="bg-1" class="bg-slide active" style="background-image: url('https://images.unsplash.com/photo-1541339907198-e08756dedf3f?q=80&w=2070');"></div>
    <div id="bg-2" class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=2070');"></div>
    <div class="bg-overlay"></div>

    <div id="toast-container" class="fixed bottom-5 right-5 flex flex-col gap-3" style="z-index: 9999;"></div>

    <!-- ================= PAGE 1: MAIN MENU (LOBBY) ================= -->
    <div id="page-main" class="page active flex flex-col justify-center items-center h-full relative">
        <button onclick="navigate('page-login')" class="absolute top-8 right-8 border border-white/40 hover:bg-white/20 text-white px-6 py-2 rounded-full font-semibold transition flex items-center gap-2">
            <i class="fa-solid fa-user-tie"></i> Masuk Pegawai
        </button>
        
        <div class="text-center mt-12 glass-panel p-12 rounded-3xl w-11/12 max-w-3xl border-t border-white/30">
            <div class="w-24 h-24 bg-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-6 shadow-[0_0_20px_rgba(16,185,129,0.4)] border border-emerald-500/50">
                <i class="fa-solid fa-building-columns text-4xl text-emerald-400"></i>
            </div>
            <h1 class="text-5xl font-bold mb-4">Sistem Digital SiTamu</h1>
            <p class="text-xl text-gray-200 mb-10 font-light">Selamat datang. Silakan isi buku tamu sebelum menemui pimpinan.</p>
            <button onclick="navigate('page-guest')" class="bg-accent hover:bg-yellow-500 text-primary px-10 py-5 rounded-full text-2xl font-bold transition transform hover:scale-105 shadow-xl flex items-center gap-4 mx-auto w-full max-w-md justify-center">
                <i class="fa-solid fa-clipboard-user"></i> ISI BUKU TAMU
            </button>
        </div>
    </div>

    <!-- ================= PAGE 2: GUEST WIZARD (Mockup) ================= -->
    <div id="page-guest" class="page flex flex-col h-full pt-10 px-8">
        <div class="flex justify-between items-center mb-6 max-w-5xl mx-auto w-full">
            <button onclick="navigate('page-main')" class="text-white hover:text-accent transition text-lg bg-black/20 p-3 rounded-full h-12 w-12 flex justify-center items-center glass-panel"><i class="fa-solid fa-arrow-left"></i></button>
            <h2 class="text-2xl font-bold">Formulir Tamu</h2>
            <div class="w-12"></div>
        </div>
        <div class="glass-panel rounded-3xl max-w-5xl mx-auto w-full flex-1 mb-10 flex flex-col p-8 bg-white/5 justify-center items-center text-center">
            <i class="fa-solid fa-hammer text-6xl text-gray-400 mb-6"></i>
            <h3 class="text-2xl font-bold mb-2">Modul Tamu Siap</h3>
            <button onclick="showToast('Data tamu berhasil dikirim ke Admin!', 'success'); navigate('page-main');" class="mt-8 bg-accent text-primary px-8 py-3 rounded-xl font-bold">Kembali ke Lobby</button>
        </div>
    </div>

    <!-- ================= PAGE 3: LOGIN (RAMAH AWAM + FACE SCAN) ================= -->
    <div id="page-login" class="page flex items-center justify-center h-full">
        <button onclick="navigate('page-main')" class="absolute top-8 left-8 text-white hover:text-accent transition text-lg bg-black/20 p-3 rounded-full h-12 w-12 flex justify-center items-center glass-panel">
            <i class="fa-solid fa-home"></i>
        </button>
        
        <div class="glass-panel p-10 rounded-3xl w-full max-w-md bg-primary/95 border border-white/20 shadow-2xl relative overflow-hidden transition-all duration-300">
            <div class="absolute top-0 left-0 w-full h-2 bg-accent"></div>
            
            <!-- STEP 1: INPUT USER & PASS (Dibuat sangat sederhana) -->
            <div id="login-step-1">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl text-accent">
                        <i class="fa-solid fa-user-lock"></i>
                    </div>
                    <h2 class="text-3xl font-bold">Halo, Pegawai!</h2>
                    <p class="text-gray-400 mt-2">Silakan masukkan data Anda untuk masuk ke sistem sekolah.</p>
                </div>

                <form onsubmit="processCredentials(event)">
                    <div class="mb-5">
                        <label class="block text-gray-300 font-semibold mb-2">Nama Pengguna (Username)</label>
                        <input type="text" id="l-user" class="w-full bg-black/50 border-2 border-white/20 rounded-xl py-4 px-5 text-white text-lg focus:outline-none focus:border-accent transition" placeholder="Contoh: admin / kepsek" required>
                    </div>
                    <div class="mb-6 relative">
                        <label class="block text-gray-300 font-semibold mb-2">Kata Sandi (Password)</label>
                        <div class="relative">
                            <input type="password" id="l-pass" class="w-full bg-black/50 border-2 border-white/20 rounded-xl py-4 px-5 text-white text-lg focus:outline-none focus:border-accent transition pr-12" placeholder="Masukkan kata sandi..." required>
                            <button type="button" onclick="togglePassword()" class="absolute right-5 top-4 text-gray-400 hover:text-white text-xl"><i id="eye-icon" class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>
                    <button type="submit" id="btn-next" class="w-full bg-accent hover:bg-yellow-500 text-primary py-4 rounded-xl font-bold text-lg transition flex justify-center items-center gap-2 shadow-lg">
                        Lanjut ke Keamanan <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>

            <!-- STEP 2: FACE SCAN VERIFICATION -->
            <div id="login-step-2" class="hidden text-center">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-accent mb-2">Verifikasi Wajah</h2>
                    <p class="text-gray-300 text-sm">Tatap kamera untuk mengonfirmasi identitas Anda.</p>
                </div>

                <div class="scan-box bg-black/50 flex items-center justify-center relative mb-6">
                    <!-- Elemen Video Kamera -->
                    <video id="login-camera-stream" autoplay playsinline class="absolute inset-0 w-full h-full object-cover hidden"></video>
                    <!-- Laser Hijau (Akan muncul saat scanning) -->
                    <div class="scan-laser" id="scan-laser"></div>
                    <!-- Ikon Loading/Standby -->
                    <div id="cam-standby-icon" class="text-gray-500 flex flex-col items-center">
                        <i class="fa-solid fa-camera-rotate text-5xl mb-2"></i>
                        <span class="text-sm">Menyiapkan...</span>
                    </div>
                </div>

                <p id="scan-status-text" class="text-lg font-semibold text-gray-300 h-8 mb-4">Mohon tunggu...</p>
                
                <!-- TOMBOL ANTI-MACET (Muncul jika kamera diblokir browser) -->
                <button id="btn-fallback-scan" onclick="simulateFaceScan()" class="hidden w-full bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-bold transition mb-3">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Gunakan Simulasi Scan
                </button>
                
                <button onclick="cancelLogin()" class="w-full bg-transparent border border-gray-500 text-gray-400 hover:text-white hover:border-white py-3 rounded-xl font-semibold transition">
                    Batalkan
                </button>
            </div>

        </div>
    </div>

    <script>
        // === GLOBAL UTILS ===
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let icon = 'fa-info-circle', color = 'bg-blue-600';
            if(type === 'error') { icon = 'fa-circle-xmark'; color = 'bg-red-600'; }
            if(type === 'success') { icon = 'fa-circle-check'; color = 'bg-emerald-600'; }
            if(type === 'warning') { icon = 'fa-triangle-exclamation'; color = 'bg-yellow-600'; }

            toast.className = `${color} text-white px-6 py-4 rounded-xl shadow-lg flex items-center gap-3 transform translate-y-10 opacity-0 transition-all duration-300`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-xl"></i> <span class="font-medium">${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function navigate(pageId) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if(pageId !== 'page-login') cancelLogin(); // Reset form login jika keluar
        }

        // === LOGIN TAHAP 1 (KREDENSIAL) ===
        let currentRoleAttempt = '';

        function togglePassword() {
            const input = document.getElementById('l-pass');
            const icon = document.getElementById('eye-icon');
            if(input.type === 'password') {
                input.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); icon.classList.add('text-accent');
            } else {
                input.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); icon.classList.remove('text-accent');
            }
        }

        function processCredentials(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-next');
            const user = document.getElementById('l-user').value.toLowerCase();
            const pass = document.getElementById('l-pass').value;
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengecek Data...';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = 'Lanjut ke Keamanan <i class="fa-solid fa-arrow-right"></i>';
                btn.disabled = false;

                // Cek kebenaran data (Simulasi)
                if ((user === 'admin' && pass === 'admin') || (user === 'kepsek' && pass === 'kepsek')) {
                    currentRoleAttempt = user; // Simpan role untuk sesi ini
                    
                    // Pindah ke Tahap 2: Face Scan
                    document.getElementById('login-step-1').classList.add('hidden');
                    document.getElementById('login-step-2').classList.remove('hidden');
                    startFaceScan();
                } else {
                    showToast("Nama Pengguna atau Kata Sandi salah!", "error");
                }
            }, 800);
        }

        // === LOGIN TAHAP 2 (FACE SCAN BIO-LOGIN) ===
        let loginCamStream = null;

        async function startFaceScan() {
            const video = document.getElementById('login-camera-stream');
            const icon = document.getElementById('cam-standby-icon');
            const laser = document.getElementById('scan-laser');
            const statusText = document.getElementById('scan-status-text');
            const btnFallback = document.getElementById('btn-fallback-scan');
            
            statusText.innerText = "Mengakses Kamera...";
            statusText.className = "text-lg font-semibold text-gray-300 h-8 mb-4";
            btnFallback.classList.add('hidden');

            try {
                // Mencoba menyalakan kamera
                loginCamStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = loginCamStream;
                video.classList.remove('hidden');
                icon.classList.add('hidden');
                
                // Mulai Animasi Scanning
                statusText.innerText = "Mendeteksi Garis Wajah...";
                laser.style.display = 'block';

                // Simulasi Proses AI berjalan selama 3 detik
                setTimeout(() => {
                    executeLoginSuccess();
                }, 3000);

            } catch (err) {
                // JIKA KAMERA DIBLOKIR BROWSER / ERROR
                statusText.innerText = "Kamera Terblokir!";
                statusText.className = "text-lg font-semibold text-red-400 h-8 mb-4";
                icon.innerHTML = '<i class="fa-solid fa-video-slash text-5xl mb-2 text-red-400"></i><span class="text-sm">Akses Ditolak</span>';
                
                // Munculkan tombol anti-macet
                btnFallback.classList.remove('hidden');
                showToast("Browser Anda memblokir kamera. Gunakan tombol simulasi di bawah.", "warning");
            }
        }

        function simulateFaceScan() {
            // Ini dijalankan jika pengguna menekan tombol "Gunakan Simulasi Scan"
            const statusText = document.getElementById('scan-status-text');
            const laser = document.getElementById('scan-laser');
            
            statusText.innerText = "Memproses Simulasi Wajah...";
            statusText.className = "text-lg font-semibold text-blue-400 h-8 mb-4";
            laser.style.display = 'block';

            setTimeout(() => {
                executeLoginSuccess();
            }, 2000);
        }

        function executeLoginSuccess() {
            const statusText = document.getElementById('scan-status-text');
            const laser = document.getElementById('scan-laser');
            
            // Tampilan Sukses
            laser.style.display = 'none';
            statusText.innerText = "Wajah Dikenali. Akses Diberikan!";
            statusText.className = "text-lg font-bold text-emerald-400 h-8 mb-4 scale-105 transition-transform";
            
            showToast(`Selamat datang kembali, ${currentRoleAttempt.toUpperCase()}!`, "success");

            // Matikan kamera dan arahkan ke dasbor simulasi (kembali ke utama untuk demo)
            setTimeout(() => {
                cancelLogin();
                navigate('page-main'); // Idealnya di sini window.location.href = '/dasbor-kepsek'
            }, 1500);
        }

        function cancelLogin() {
            // Matikan stream kamera jika menyala
            if (loginCamStream) {
                loginCamStream.getTracks().forEach(track => track.stop());
                loginCamStream = null;
            }
            
            // Reset UI kembali ke Step 1
            document.getElementById('login-step-2').classList.add('hidden');
            document.getElementById('login-step-1').classList.remove('hidden');
            document.getElementById('login-camera-stream').classList.add('hidden');
            document.getElementById('cam-standby-icon').classList.remove('hidden');
            document.getElementById('scan-laser').style.display = 'none';
            
            // Kosongkan inputan
            document.getElementById('l-user').value = '';
            document.getElementById('l-pass').value = '';
        }
    </script>
</body>
</html>
